name: build-and-deploy

on:
  push:
    branches:
      - 'master'
  workflow_dispatch:

jobs:
  docker:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        # Actions are pinned to full commit SHAs (audit 2026-08-18 C-1):
        # mutable tags can be re-pointed upstream and would pull compromised
        # code into a workflow holding DOCKERHUB_TOKEN. Keep the tag comment
        # in sync when upgrading.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      -
        name: Get commit SHA short
        id: commit
        run: echo "sha7=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      -
        name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        id: docker_build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: |
            steemit/conveyor:latest
            steemit/conveyor:latest-${{ steps.commit.outputs.sha7 }}
          build-args: |
            VERSION=${{ steps.commit.outputs.sha7 }}
      -
        name: Image info
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          echo "=== Docker Image Information ==="
          echo "Image: steemit/conveyor"
          echo "Tags:"
          echo "  - steemit/conveyor:latest"
          echo "  - steemit/conveyor:latest-${{ steps.commit.outputs.sha7 }}"
          echo "Digest: ${{ steps.docker_build.outputs.digest }}"
          echo "================================"
